name: nightly-recall-update

on:
  schedule:
    # Every other day at 08:00 UTC (03:00 ET / 00:00 PT).
    # `*/2` = odd days of the month (1,3,5,...) — halves Tavily spend.
    - cron: "0 8 */2 * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: recall-radar-nightly
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run pipeline
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          # Spend guard: cap enrichments per run. Override via the
          # RECALL_RADAR_MAX_ENRICH secret; defaults to 10 when unset.
          RECALL_RADAR_MAX_ENRICH: ${{ secrets.RECALL_RADAR_MAX_ENRICH || '10' }}
        run: recall-radar

      - name: Commit updated dataset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/recalls.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(data): nightly recall update $(date -u +%Y-%m-%d)"
            git push
          fi
