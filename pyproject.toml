[project]
name = "recall-radar"
version = "0.1.0"
description = "Nightly US food recall intelligence — openFDA + Tavily Pro Research, exposed as an MCP server"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Recall Radar contributors" }]
keywords = ["food-safety", "recalls", "openfda", "tavily", "mcp", "agents"]
dependencies = [
    "fastmcp>=3.0",
    "httpx>=0.27",
]

[project.scripts]
recall-radar = "recall_radar.pipeline:main"
recall-radar-server = "recall_radar.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["recall_radar"]
